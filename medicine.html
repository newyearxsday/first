<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고양시 약국 검색 지도</title>
    <!-- 구글 폰트 적용 (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #EBF5FB;
            --primary-color: #3498DB;
            --primary-hover: #2980B9;
            --accent-color: #F1C40F;
            --accent-hover: #F39C12;
            --text-color: #2C3E50;
            --border-color: #D6EAF8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            color: var(--text-color);
        }

        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽 사이드바 디자인 */
        #sidebar {
            width: 380px;
            height: 100%;
            background-color: var(--bg-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
            z-index: 2;
        }

        .header {
            padding: 24px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
        }

        .search-box button {
            padding: 12px 20px;
            background-color: var(--accent-color);
            color: #333333;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .search-box button:hover {
            background-color: var(--accent-hover);
        }

        .search-box button:active {
            transform: scale(0.98);
        }

        /* 검색 결과 목록 */
        #placesList {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 12px;
        }

        #placesList .item {
            background: #ffffff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        #placesList .item:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.15);
        }

        #placesList .item h5 {
            font-size: 1.05rem;
            color: var(--text-color);
            margin-bottom: 6px;
            font-weight: 700;
        }

        #placesList .item .address {
            font-size: 0.85rem;
            color: #7F8C8D;
            margin-bottom: 4px;
        }

        #placesList .item .phone {
            font-size: 0.85rem;
            color: var(--primary-color);
            font-weight: 500;
        }

        #pagination {
            padding: 16px;
            text-align: center;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
        }

        #pagination a {
            display: inline-block;
            margin: 0 4px;
            padding: 6px 12px;
            border-radius: 6px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
        }

        #pagination a.on {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        /* 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 커스텀 오버레이 (인포윈도우) 디자인 */
        .custom-overlay {
            position: relative;
            bottom: 50px;
            border-radius: 8px;
            border: 1px solid #ccc;
            border-bottom: 2px solid #ccc;
            float: left;
            background: #fff;
            padding: 12px 16px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
        }

        .custom-overlay .title {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .custom-overlay .address {
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- 왼쪽 사이드바 -->
    <div id="sidebar">
        <div class="header">
            <h1>💊 고양시 약국 검색</h1>
            <form onsubmit="searchPlaces(); return false;">
                <div class="search-box">
                    <input type="text" id="keyword" placeholder="약국 이름 또는 동 이름 입력" value="주엽동 약국">
                    <button type="submit">검색</button>
                </div>
            </form>
        </div>
        
        <ul id="placesList"></ul>
        <div id="pagination"></div>
    </div>

    <!-- 지도 영역 -->
    <div id="map"></div>
</div>

<!-- 카카오맵 API (키 적용 및 services 라이브러리 포함) -->
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=53f0341bd38717151888f5e0a084a81d&libraries=services"></script>
<script>
    // 고양시 중심 좌표 (고양시청 근처)
    var mapContainer = document.getElementById('map'),
        mapOption = {
            center: new kakao.maps.LatLng(37.6584, 126.8320),
            level: 5
        };

    var map = new kakao.maps.Map(mapContainer, mapOption);
    var ps = new kakao.maps.services.Places();
    var infowindow = new kakao.maps.InfoWindow({zIndex: 1});
    var markers = [];

    // 처음 로드 시 자동 검색 실행
    searchPlaces();

    // 키워드 검색 함수
    function searchPlaces() {
        var keyword = document.getElementById('keyword').value.trim();

        if (!keyword) {
            alert('키워드를 입력해 주세요!');
            return false;
        }

        // 고양시 지역 검색으로 범위를 제한하기 위해 입력값 정리
        var searchKeyword = keyword;
        if (!searchKeyword.includes('고양') && !searchKeyword.includes('일산')) {
            searchKeyword = '고양시 ' + searchKeyword;
        }
        if (!searchKeyword.includes('약국')) {
            searchKeyword += ' 약국';
        }

        ps.keywordSearch(searchKeyword, placesSearchCB);
    }

    // 장소검색이 완료됐을 때 호출되는 콜백함수
    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);
            displayPagination(pagination);
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('검색 결과가 존재하지 않습니다.');
        } else if (status === kakao.maps.services.Status.ERROR) {
            alert('검색 결과 중 오류가 발생했습니다.');
        }
    }

    // 검색 결과 목록과 마커를 표출하는 함수
    function displayPlaces(places) {
        var listEl = document.getElementById('placesList'),
            menuEl = document.getElementById('sidebar'),
            fragment = document.createDocumentFragment(),
            bounds = new kakao.maps.LatLngBounds();

        removeAllChildNods(listEl);
        removeMarker();

        for (var i = 0; i < places.length; i++) {
            var placePosition = new kakao.maps.LatLng(places[i].y, places[i].x),
                marker = addMarker(placePosition, i),
                itemEl = getListItem(i, places[i]);

            bounds.extend(placePosition);

            (function(marker, title, address, place) {
                // 마커 및 리스트 아이템 클릭 이벤트
                kakao.maps.event.addListener(marker, 'click', function() {
                    displayInfowindow(marker, title, address);
                });

                itemEl.onclick = function() {
                    displayInfowindow(marker, title, address);
                    map.panTo(new kakao.maps.LatLng(place.y, place.x));
                };
            })(marker, places[i].place_name, places[i].road_address_name || places[i].address_name, places[i]);

            fragment.appendChild(itemEl);
        }

        listEl.appendChild(fragment);
        menuEl.scrollTop = 0;
        map.setBounds(bounds);
    }

    // 검색결과 항목을 Element로 반환하는 함수
    function getListItem(index, places) {
        var el = document.createElement('li');
        var itemStr = '<div class="item">' +
                      '  <h5>' + places.place_name + '</h5>';

        if (places.road_address_name) {
            itemStr += '  <div class="address">' + places.road_address_name + '</div>';
        } else {
            itemStr += '  <div class="address">' + places.address_name + '</div>';
        }

        if (places.phone) {
            itemStr += '  <div class="phone">📞 ' + places.phone + '</div>';
        }
        itemStr += '</div>';

        el.innerHTML = itemStr;
        return el;
    }

    // 마커 생성 함수
    function addMarker(position) {
        var marker = new kakao.maps.Marker({
            position: position
        });
        marker.setMap(map);
        markers.push(marker);
        return marker;
    }

    // 지도 위에 표시되고 있는 마커를 모두 제거합니다
    function removeMarker() {
        for (var i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        markers = [];
    }

    // 인포윈도우 표시 함수
    function displayInfowindow(marker, title, address) {
        var content = '<div class="custom-overlay">' +
                      '  <div class="title">' + title + '</div>' +
                      '  <div class="address">' + address + '</div>' +
                      '</div>';

        infowindow.setContent(content);
        infowindow.open(map, marker);
    }

    // 페이지네이션 표시
    function displayPagination(pagination) {
        var paginationEl = document.getElementById('pagination'),
            fragment = document.createDocumentFragment(),
            i;

        while (paginationEl.hasChildNodes()) {
            paginationEl.removeChild(paginationEl.lastChild);
        }

        for (i = 1; i <= pagination.last; i++) {
            var el = document.createElement('a');
            el.href = "#";
            el.innerHTML = i;

            if (i === pagination.current) {
                el.className = 'on';
            } else {
                el.onclick = (function(i) {
                    return function() {
                        pagination.gotoPage(i);
                    }
                })(i);
            }

            fragment.appendChild(el);
        }
        paginationEl.appendChild(fragment);
    }

    // 자식 노드 제거 함수
    function removeAllChildNods(el) {
        while (el.hasChildNodes()) {
            el.removeChild(el.lastChild);
        }
    }
</script>
</body>
</html>
