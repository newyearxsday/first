<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="고양시 약국을 지도에서 검색하고 확인할 수 있는 카카오맵 기반 웹앱" />
  <title>고양시 약국 지도</title>

  <style>
    :root {
      --sky-50: #f5fcff;
      --sky-100: #e8f8ff;
      --sky-200: #d5f1ff;
      --sky-300: #aee2ff;
      --sky-500: #69c5ee;
      --sky-700: #2d8fb9;
      --navy: #19354a;
      --text: #24465d;
      --muted: #7290a2;
      --yellow: #ffd84d;
      --yellow-hover: #f8c92b;
      --white: #ffffff;
      --line: rgba(56, 124, 157, 0.14);
      --shadow: 0 18px 48px rgba(33, 104, 135, 0.15);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family:
        Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui,
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--sky-100);
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 85% 8%, rgba(255, 255, 255, 0.82), transparent 28%),
        linear-gradient(135deg, #edfaff 0%, #dff5ff 50%, #eefbff 100%);
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .sidebar {
      position: absolute;
      z-index: 10;
      left: 20px;
      top: 20px;
      bottom: 20px;
      width: min(390px, calc(100vw - 40px));
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sidebar-header {
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(232, 248, 255, 0.95), rgba(255, 255, 255, 0.94));
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
      color: var(--sky-700);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--yellow);
      box-shadow: 0 0 0 5px rgba(255, 216, 77, 0.18);
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: 27px;
      line-height: 1.25;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 8px 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .search-box {
      display: flex;
      gap: 8px;
      padding: 7px;
      border: 1px solid rgba(105, 197, 238, 0.27);
      border-radius: 16px;
      background: var(--white);
      box-shadow: 0 10px 24px rgba(76, 152, 181, 0.09);
    }

    .search-box:focus-within {
      border-color: rgba(45, 143, 185, 0.45);
      box-shadow:
        0 10px 24px rgba(76, 152, 181, 0.10),
        0 0 0 4px rgba(105, 197, 238, 0.12);
    }

    .search-icon {
      width: 20px;
      height: 20px;
      margin: auto 2px auto 8px;
      flex: 0 0 auto;
      color: var(--sky-700);
    }

    #searchInput {
      min-width: 0;
      flex: 1;
      height: 40px;
      padding: 0 2px;
      border: 0;
      outline: 0;
      color: var(--navy);
      background: transparent;
      font-size: 14px;
    }

    #searchInput::placeholder {
      color: #9db2bf;
    }

    .search-button {
      height: 40px;
      padding: 0 17px;
      border: 0;
      border-radius: 12px;
      background: var(--yellow);
      color: #614f00;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
      box-shadow: 0 7px 15px rgba(232, 182, 0, 0.2);
    }

    .search-button:hover {
      background: var(--yellow-hover);
      transform: translateY(-1px);
    }

    .search-button:active {
      transform: translateY(0);
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 15px;
    }

    .result-count {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .reset-button {
      border: 0;
      background: transparent;
      color: var(--sky-700);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      padding: 3px 0;
    }

    .reset-button:hover { text-decoration: underline; }

    .status {
      margin-top: 9px;
      min-height: 18px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .results {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px;
      background: rgba(248, 253, 255, 0.68);
    }

    .results::-webkit-scrollbar { width: 7px; }
    .results::-webkit-scrollbar-thumb {
      background: #cbeaf8;
      border-radius: 999px;
    }

    .result-card {
      position: relative;
      display: block;
      width: 100%;
      margin-bottom: 9px;
      padding: 15px 15px 14px;
      border: 1px solid rgba(78, 155, 184, 0.11);
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 20px rgba(60, 131, 157, 0.06);
      cursor: pointer;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
      text-align: left;
    }

    .result-card:hover {
      transform: translateY(-2px);
      border-color: rgba(105, 197, 238, 0.38);
      box-shadow: 0 12px 28px rgba(60, 131, 157, 0.11);
    }

    .result-card.active {
      border-color: rgba(255, 216, 77, 0.72);
      box-shadow:
        0 12px 28px rgba(60, 131, 157, 0.10),
        0 0 0 3px rgba(255, 216, 77, 0.12);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .pharmacy-name {
      min-width: 0;
      color: var(--navy);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      flex: 0 0 auto;
      padding: 4px 7px;
      border-radius: 999px;
      background: #fff8d7;
      color: #7a6500;
      font-size: 10px;
      font-weight: 900;
    }

    .address {
      color: #6f8a9a;
      font-size: 11px;
      line-height: 1.55;
      word-break: keep-all;
    }

    .phone {
      margin-top: 6px;
      color: #7898aa;
      font-size: 11px;
    }

    .empty-state {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .empty-icon {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin: 0 auto 13px;
      border-radius: 17px;
      background: var(--sky-100);
      color: var(--sky-700);
      font-size: 25px;
    }

    .map-chip {
      position: absolute;
      z-index: 5;
      right: 20px;
      top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 13px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(33, 104, 135, 0.11);
      color: var(--navy);
      font-size: 11px;
      font-weight: 900;
    }

    .map-chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--yellow);
      box-shadow: 0 0 0 4px rgba(255, 216, 77, 0.18);
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: rgba(234, 249, 255, 0.38);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .loading.hidden { display: none; }

    .loading-card {
      width: min(300px, calc(100vw - 48px));
      padding: 22px;
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 20px;
      background: rgba(255,255,255,0.94);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto 12px;
      border: 3px solid #d8f1fb;
      border-top-color: var(--sky-700);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-title {
      margin: 0;
      color: var(--navy);
      font-size: 14px;
      font-weight: 900;
    }

    .loading-text {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 760px) {
      .sidebar {
        left: 12px;
        right: 12px;
        top: 12px;
        bottom: auto;
        width: auto;
        height: min(520px, calc(100vh - 24px));
        border-radius: 22px;
      }

      .map-chip {
        right: 14px;
        top: auto;
        bottom: 14px;
      }

      .sidebar-header { padding: 22px 18px 17px; }
      .results { padding: 10px; }
      h1 { font-size: 23px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div id="map" aria-label="고양시 약국 지도"></div>

    <div class="map-chip">
      <span class="map-chip-dot"></span>
      고양시 약국 찾기
    </div>

    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="eyebrow">
          <span class="eyebrow-dot"></span>
          GOYANG · PHARMACY MAP
        </div>

        <h1>고양시 약국 지도</h1>
        <p class="subtitle">
          약국 이름이나 주소를 검색해 원하는 곳을 빠르게 찾아보세요.
        </p>

        <form class="search-box" id="searchForm">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="6.8" stroke="currentColor" stroke-width="1.9"></circle>
            <path d="M16.2 16.2L21 21" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
          </svg>

          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="예: 중앙, 우리, 일산, 대화"
            aria-label="약국 이름 또는 주소 검색"
          />

          <button class="search-button" type="submit">검색</button>
        </form>

        <div class="summary-row">
          <div class="result-count" id="resultCount">약국 정보를 불러오는 중...</div>
          <button class="reset-button" id="resetButton" type="button">전체 보기</button>
        </div>

        <div class="status" id="statusText" aria-live="polite">
          고양시 지역의 약국 정보를 불러오고 있습니다.
        </div>
      </header>

      <section class="results" id="results" aria-live="polite"></section>
    </aside>

    <div class="loading" id="loadingOverlay">
      <div class="loading-card">
        <div class="spinner"></div>
        <p class="loading-title">약국 정보를 불러오는 중이에요</p>
        <p class="loading-text">고양시 여러 구역을 나누어 검색하고 있습니다.</p>
      </div>
    </div>
  </div>

  <!-- Kakao Maps JavaScript API -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=53f0341bd38717151888f5e0a084a81d&libraries=services"></script>

  <script>
    (() => {
      "use strict";

      // 고양시 중심 좌표
      const GOYANG_CENTER = { lat: 37.6584, lng: 126.8320 };

      // 고양시를 여러 사각형으로 나눠 검색해, 한 번의 검색에서 발생하는 최대 45개 제한의 영향을 줄입니다.
      const SEARCH_BOUNDS = {
        minLat: 37.6000,
        maxLat: 37.7400,
        minLng: 126.7200,
        maxLng: 126.9000,
        rows: 4,
        cols: 4
      };

      const mapContainer = document.getElementById("map");
      const searchForm = document.getElementById("searchForm");
      const searchInput = document.getElementById("searchInput");
      const resetButton = document.getElementById("resetButton");
      const resultCount = document.getElementById("resultCount");
      const statusText = document.getElementById("statusText");
      const resultsEl = document.getElementById("results");
      const loadingOverlay = document.getElementById("loadingOverlay");

      const map = new kakao.maps.Map(mapContainer, {
        center: new kakao.maps.LatLng(GOYANG_CENTER.lat, GOYANG_CENTER.lng),
        level: 8
      });

      const places = new kakao.maps.services.Places();
      const infoWindow = new kakao.maps.InfoWindow({ zIndex: 20 });

      let allPharmacies = [];
      let visiblePharmacies = [];
      let markers = [];
      let activeId = null;

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function normalize(value) {
        return String(value ?? "")
          .toLowerCase()
          .replace(/\s+/g, "")
          .trim();
      }

      function getAddress(place) {
        return place.road_address_name || place.address_name || "주소 정보 없음";
      }

      function isInsideGoyang(place) {
        const text = `${place.address_name || ""} ${place.road_address_name || ""}`;
        return text.includes("고양시");
      }

      function clearMarkers() {
        markers.forEach(marker => marker.setMap(null));
        markers = [];
        infoWindow.close();
      }

      function makeMarker(place) {
        const marker = new kakao.maps.Marker({
          map,
          position: new kakao.maps.LatLng(Number(place.y), Number(place.x))
        });

        kakao.maps.event.addListener(marker, "click", () => {
          focusPharmacy(place.id);
        });

        return marker;
      }

      function renderMarkers(items) {
        clearMarkers();

        markers = items.map(makeMarker);
      }

      function renderList(items) {
        if (!items.length) {
          resultsEl.innerHTML = `
            <div class="empty-state">
              <div>
                <div class="empty-icon">⌕</div>
                <strong>검색 결과가 없어요.</strong><br />
                다른 약국 이름이나 주소를 입력해 보세요.
              </div>
            </div>
          `;
          return;
        }

        resultsEl.innerHTML = items.map(place => `
          <button class="result-card ${activeId === place.id ? "active" : ""}"
                  type="button"
                  data-place-id="${escapeHtml(place.id)}">
            <div class="card-top">
              <div class="pharmacy-name">${escapeHtml(place.place_name)}</div>
              <span class="badge">약국</span>
            </div>
            <div class="address">${escapeHtml(getAddress(place))}</div>
            ${place.phone ? `<div class="phone">☎ ${escapeHtml(place.phone)}</div>` : ""}
          </button>
        `).join("");

        resultsEl.querySelectorAll(".result-card").forEach(card => {
          card.addEventListener("click", () => {
            focusPharmacy(card.dataset.placeId);
          });
        });
      }

      function focusPharmacy(id) {
        const place = visiblePharmacies.find(item => String(item.id) === String(id));
        if (!place) return;

        activeId = String(id);

        const position = new kakao.maps.LatLng(Number(place.y), Number(place.x));
        map.setCenter(position);
        map.setLevel(4);

        const markerIndex = visiblePharmacies.findIndex(item => String(item.id) === String(id));
        const marker = markers[markerIndex];

        if (marker) {
          const content = `
            <div style="
              padding:11px 13px;
              border-radius:12px;
              background:#fff;
              border:1px solid rgba(45,143,185,.12);
              box-shadow:0 10px 25px rgba(33,104,135,.16);
              color:#19354a;
              font-size:12px;
              min-width:170px;
              line-height:1.45;
            ">
              <div style="font-weight:900;margin-bottom:3px;">
                ${escapeHtml(place.place_name)}
              </div>
              <div style="color:#718b9b;">
                ${escapeHtml(getAddress(place))}
              </div>
            </div>
          `;
          infoWindow.setContent(content);
          infoWindow.open(map, marker);
        }

        resultsEl.querySelectorAll(".result-card").forEach(card => {
          card.classList.toggle("active", String(card.dataset.placeId) === String(id));
        });

        const activeCard = resultsEl.querySelector(`.result-card[data-place-id="${CSS.escape(String(id))}"]`);
        if (activeCard) {
          activeCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }

      function fitToItems(items) {
        if (!items.length) return;

        if (items.length === 1) {
          map.setCenter(new kakao.maps.LatLng(Number(items[0].y), Number(items[0].x)));
          map.setLevel(5);
          return;
        }

        const bounds = new kakao.maps.LatLngBounds();
        items.forEach(place => {
          bounds.extend(new kakao.maps.LatLng(Number(place.y), Number(place.x)));
        });
        map.setBounds(bounds, 55, 55, 55, 55);
      }

      function updateView(keyword = "") {
        const q = normalize(keyword);

        visiblePharmacies = q
          ? allPharmacies.filter(place => {
              const name = normalize(place.place_name);
              const address = normalize(getAddress(place));
              return name.includes(q) || address.includes(q);
            })
          : [...allPharmacies];

        activeId = null;
        resultCount.textContent = `총 ${visiblePharmacies.length.toLocaleString("ko-KR")}곳`;

        if (q) {
          statusText.textContent =
            visiblePharmacies.length
              ? `'${keyword.trim()}'이(가) 포함된 약국을 찾았어요.`
              : `'${keyword.trim()}'에 해당하는 약국이 없어요.`;
        } else {
          statusText.textContent = "고양시에서 찾은 약국을 표시하고 있습니다.";
        }

        renderList(visiblePharmacies);
        renderMarkers(visiblePharmacies);
        fitToItems(visiblePharmacies);
      }

      function mergePlaces(newPlaces) {
        const existing = new Set(allPharmacies.map(place => String(place.id)));
        newPlaces.forEach(place => {
          if (!isInsideGoyang(place)) return;
          const id = String(place.id);
          if (!existing.has(id)) {
            existing.add(id);
            allPharmacies.push(place);
          }
        });

        allPharmacies.sort((a, b) =>
          String(a.place_name).localeCompare(String(b.place_name), "ko")
        );
      }

      function makeGridBounds() {
        const { minLat, maxLat, minLng, maxLng, rows, cols } = SEARCH_BOUNDS;
        const latStep = (maxLat - minLat) / rows;
        const lngStep = (maxLng - minLng) / cols;
        const cells = [];

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const south = minLat + r * latStep;
            const north = r === rows - 1 ? maxLat : south + latStep;
            const west = minLng + c * lngStep;
            const east = c === cols - 1 ? maxLng : west + lngStep;

            cells.push(
              new kakao.maps.LatLngBounds(
                new kakao.maps.LatLng(south, west),
                new kakao.maps.LatLng(north, east)
              )
            );
          }
        }

        return cells;
      }

      function searchCell(bounds, page = 1) {
        return new Promise(resolve => {
          places.categorySearch(
            "PM9",
            (data, status, pagination) => {
              if (status === kakao.maps.services.Status.OK) {
                mergePlaces(data);

                if (pagination && pagination.hasNextPage && page < 3) {
                  pagination.nextPage();
                  resolve(false);
                  return;
                }
              }

              resolve(true);
            },
            {
              bounds,
              size: 15,
              page
            }
          );
        });
      }

      async function loadPharmacies() {
        const cells = makeGridBounds();
        let completed = 0;

        // 검색 요청을 순차 처리해 브라우저에서 과도한 동시 요청이 발생하지 않도록 합니다.
        for (const bounds of cells) {
          await new Promise(resolve => {
            let page = 1;

            const searchPage = () => {
              places.categorySearch(
                "PM9",
                (data, status, pagination) => {
                  if (status === kakao.maps.services.Status.OK && Array.isArray(data)) {
                    mergePlaces(data);
                  }

                  if (
                    status === kakao.maps.services.Status.OK &&
                    pagination &&
                    pagination.hasNextPage &&
                    page < 3
                  ) {
                    page += 1;
                    pagination.nextPage();
                    return;
                  }

                  completed += 1;
                  statusText.textContent =
                    `고양시 약국 정보를 불러오는 중… ${completed}/${cells.length} 구역`;
                  resolve();
                },
                {
                  bounds,
                  size: 15,
                  page
                }
              );
            };

            searchPage();
          });
        }

        loadingOverlay.classList.add("hidden");
        updateView(searchInput.value);
        resultCount.textContent = `총 ${allPharmacies.length.toLocaleString("ko-KR")}곳`;
        statusText.textContent = allPharmacies.length
          ? "고양시에서 찾은 약국을 표시하고 있습니다."
          : "약국 정보를 가져오지 못했습니다. 도메인 등록이나 API 키 설정을 확인해 주세요.";
      }

      searchForm.addEventListener("submit", event => {
        event.preventDefault();
        updateView(searchInput.value);
      });

      resetButton.addEventListener("click", () => {
        searchInput.value = "";
        updateView("");
        searchInput.focus();
      });

      // SDK가 정상적으로 로드되었는지 확인합니다.
      if (!window.kakao || !window.kakao.maps || !window.kakao.maps.services) {
        loadingOverlay.classList.add("hidden");
        resultCount.textContent = "지도 API를 불러오지 못했어요.";
        statusText.textContent = "카카오맵 JavaScript API 키와 허용 도메인 설정을 확인해 주세요.";
        resultsEl.innerHTML = `
          <div class="empty-state">
            <div>
              <div class="empty-icon">!</div>
              카카오맵 API를 불러오지 못했습니다.<br />
              Kakao Developers에서 JavaScript 키의<br />
              허용 도메인을 등록했는지 확인해 주세요.
            </div>
          </div>
        `;
        return;
      }

      loadPharmacies().catch(error => {
        console.error(error);
        loadingOverlay.classList.add("hidden");
        resultCount.textContent = "오류가 발생했어요.";
        statusText.textContent = "약국 정보를 불러오는 동안 문제가 발생했습니다.";
      });
    })();
  </script>
</body>
</html>
